name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  checks: write
  actions: read

jobs:
  test:
    name: Testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Tests
        run: |
          mkdir -p reports
          npm run test:ci

      - name: Relatório no GitHub
        if: always()
        run: node scripts/resumo-ci.js

      - name: Publicar relatório Jest
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: Relatório de testes
          path: reports/junit.xml
          reporter: jest-junit
          fail-on-error: false
          fail-on-empty: false

      - name: Enviar artefato do relatório
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: relatorio-testes
          path: reports
          if-no-files-found: ignore

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck
